name: Translate Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/docs/en/**/*.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-translate all files'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  configuration:
    if: ${{ vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '' || vars.AZURE_SUBSCRIPTION_ID == '' || vars.AZURE_OPENAI_ENDPOINT == '' || vars.AZURE_OPENAI_DEPLOYMENT == '' || vars.AZURE_OPENAI_API_VERSION == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report missing translation configuration
        run: |
          echo "::warning::Automatic translation is paused until the AZURE_* and AZURE_OPENAI_* repository variables are configured. PT/FR content must be updated in the same pull request as English changes."

  translate:
    if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_OPENAI_ENDPOINT != '' && vars.AZURE_OPENAI_DEPLOYMENT != '' && vars.AZURE_OPENAI_API_VERSION != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai azure-identity

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get changed markdown files
        id: changed
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "mode=force" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'docs/docs/en/**/*.md' | sed 's|docs/docs/en/||' | tr '\n' ' ')
            if [ -z "$CHANGED" ]; then
              echo "No markdown files changed"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "files=$CHANGED" >> $GITHUB_OUTPUT
              echo "Changed files: $CHANGED"
            fi
          fi

      - name: Translate to Portuguese and French
        if: steps.changed.outputs.skip != 'true'
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "force" ]; then
            python scripts/translate_docs.py --lang pt,fr --force
          else
            for file in ${{ steps.changed.outputs.files }}; do
              python scripts/translate_docs.py --lang pt,fr --file "$file"
            done
          fi

      - name: Validate translated content
        if: steps.changed.outputs.skip != 'true'
        run: python scripts/validate_content.py

      - name: Open translation pull request
        if: steps.changed.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-translations
          delete-branch: true
          commit-message: |
            Auto-translate: update PT/FR translations

            Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>
          title: "Auto-translate: update PT/FR translations"
          body: |
            Automated PT/FR translation update generated from changed English documentation.

            - Authenticates to Microsoft Foundry with GitHub OIDC
            - Preserves code, frontmatter, URLs, and Markdown structure
            - Runs content parity validation before opening this PR