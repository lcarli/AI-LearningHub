name: Content Quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate derived pages
        run: |
          python scripts/phase2_content.py
          python scripts/phase3_content.py
          python scripts/generate_whats_new.py
          python scripts/generate_labs_index.py
          python scripts/generate_labs_json.py

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Test catalog interactions
        run: node --test scripts/test_hub_features.js

      - name: Test content links, exercises, and kits
        run: |
          python -m unittest scripts/test_content_links.py -v
          python -m unittest scripts/test_generate_kits.py -v
          python scripts/run_phase2_tests.py
          python scripts/generate_kits.py --check

      - name: Build documentation
        working-directory: docs
        run: mkdocs build --strict

      - name: Validate rendered site links
        run: python scripts/validate_site_links.py
